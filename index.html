  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

  h3 { margin: 4px 4px 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; }

    `<circle cx="46" cy="46" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - part)}"/></svg>`;
}

    <label class="f">Компьютеров</label><div class="opts" id="ns">${[1, 2, 3, 5].map((n) => `<button data-v="${n}" class="${n === 1 ? "on" : ""}">${n}</button>`).join("")}</div>
    <label class="f">Сумма оплаты (необязательно)</label><input class="i" id="nsum" inputmode="numeric" placeholder="например 300000">
    <div style="height:14px"></div><button class="btn" id="nGo">➕ Создать ключ</button>`);
  let n = "1", u = "m", seats = 1;
  const pick = (box, fn) => document.querySelectorAll(box + " button").forEach((b) => (b.onclick = () => { document.querySelectorAll(box + " button").forEach((x) => x.classList.toggle("on", x === b)); fn(b); haptic(); }));
  pick("#nt", (b) => { n = b.dataset.n; u = b.dataset.u; $("#nown").value = ""; });
  pick("#ns", (b) => (seats = +b.dataset.v));
  $("#nown").oninput = () => document.querySelectorAll("#nt button").forEach((x) => x.classList.remove("on"));
  $("#nGo").onclick = async () => {
    const name = $("#nn").value.trim(), own = +$("#nown").value;
    if (!name) return toast("Напишите имя клиента");
    const r = await adminDo("newkey", { name, n: own || n, unit: own ? $("#nunit").value : u, seats, sum: +String($("#nsum").value).replace(/\D/g, "") }, null);
    if (r?.key) sheet(`<div class="made"><div style="font-size:42px">🎉</div><h4>Ключ готов</h4><div class="sub">${esc(name)} · до ${esc(r.until)} · 💻 ${seats}</div>
      <code>${esc(r.key)}</code><div class="row2"><button class="btn" data-copy="${esc(r.key)}">📋 Скопировать</button>
      <button class="btn ghost" data-go="sharekey:${esc(r.key)}">📤 Отправить</button></div></div>`);
  };
}
function paysSheet() {
  sheet(`<h4>Оплаты</h4><div class="sub">Последние 30</div><div class="pays">${adm.pays.map((p) => `<div><span>${esc(p.name)}<br><small>${esc(p.at)}${p.months ? " · " + p.months + " мес" : ""}</small></span><b>${money(p.sum)}</b></div>`).join("") || "<div><span>Пока нет</span></div>"}</div>`);
}
async function adminDo(op, data, ok) {
  try {
    TG?.MainButton?.showProgress?.();
    const r = await api(op, data);
    if (!r.ok) { toast(r.reason === "form" ? "Проверьте поля" : T("err")); return null; }
    if (r.keys) adm = r;
    if (ok) { toast(ok); $("#sheet").hidden = true; }
    try { TG?.HapticFeedback?.notificationOccurred("success"); } catch {}
    if (op !== "newkey") renderAdmin(); else adm = await api("keys");
    return r;
  } catch { toast(T("err")); return null; } finally { TG?.MainButton?.hideProgress?.(); }
}

// ---------- нажатия ----------
document.addEventListener("click", async (e) => {
  const c = e.target.closest("[data-copy]");
  if (c) return copy(c.dataset.copy);
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; haptic(); return renderAdmin(); }
  const k = e.target.closest("[data-k]");
  if (k) { haptic(); return keySheet(adm.keys.find((x) => String(x.row) === k.dataset.k)); }
  const pk = e.target.closest("[data-pick]");
  if (pk) { tsel[tkind] = pk.dataset.pick; haptic(); return renderTariffs(); }
  const kd = e.target.closest("[data-kind]");
  if (kd) { tkind = kd.dataset.kind; haptic(); return renderTariffs(); }
  const g = e.target.closest("[data-go]");
  if (!g) return;
  haptic();
  const go = g.dataset.go;
  if (go === "store") return openLink(me.store);
  if (go === "contact") return openLink(me.contact);
  if (go === "tariffs") return window.go("tariffs");
  if (go === "close") return TG?.close ? TG.close() : window.go("me");
  if (go.startsWith("plan:")) return orderPlan(go.slice(5));
  if (go === "channel") return openLink(me.channel);
  if (go === "ref") return openLink("https://t.me/share/url?url=" + encodeURIComponent(me.ref || "https://t.me/" + me.bot) + "&text=" + encodeURIComponent(T("share")));
  if (go.startsWith("v:")) { const r = await api("video", { kind: go.slice(2) }).catch(() => null); toast(r?.ok ? T("sent") : T("err")); return; }
  if (go === "new") return newSheet();
  if (go === "pays") return paysSheet();
  if (go.startsWith("tg:")) return openLink("tg://user?id=" + go.slice(3));
  if (go.startsWith("sharekey:")) return openLink("https://t.me/share/url?url=" + encodeURIComponent(go.slice(9)) + "&text=" + encodeURIComponent("Vizachi kaliti:"));
});
document.querySelectorAll("#langs button").forEach((b) => (b.onclick = async () => {
  lang = b.dataset.l; paint(); haptic();
  api("lang", { lang }).catch(() => {});
}));
document.querySelectorAll("#seg button").forEach((b) => (b.onclick = async () => {
  view = b.dataset.v; haptic();
  document.querySelectorAll("#seg button").forEach((x) => x.classList.toggle("on", x === b));
  if (view === "admin" && !adm) { $("#app").innerHTML = `<div class="sk" style="height:300px"></div>`; adm = await api("keys"); }
  paint();
}));
function paint() {
  $("#sub").textContent = T("sub");
  $("#segMe").textContent = T("me");
  document.querySelectorAll("#langs button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  const inner = view === "tariffs" || view === "done";
  $("#seg").hidden = !me?.admin || inner;
  try { inner ? TG?.BackButton?.show() : TG?.BackButton?.hide(); } catch {}
  if (view === "admin" && adm?.ok) return renderAdmin();
  if (!me) return;
  if (view === "tariffs") return renderTariffs();
  if (view === "done" && done) return renderDone();
  renderMe();
}
try { TG?.BackButton?.onClick(() => { haptic(); window.go("me"); }); } catch {}

(async function start() {
  if (TG) { TG.ready(); TG.expand(); try { TG.setHeaderColor("secondary_bg_color"); } catch {} }
  const demo = /[?&]demo=1/.test(location.search);
  // Из бота кнопкой «Tariflar» окно открывается сразу на тарифах.
  if (new URLSearchParams(location.search).get("s") === "tariffs" || TG?.initDataUnsafe?.start_param === "tariffs") view = "tariffs";
  if (!TG?.initData && !demo) { $("#app").innerHTML = `<div class="card" style="text-align:center">${T("open", "vizachi_robot")}</div>`; return paint(); }
  try {
    me = demo ? window.DEMO_ME : await api("me");
    if (!me?.ok) throw new Error(me?.reason);
    lang = me.lang || "uz";
    if (demo && window.DEMO_ADM) { adm = window.DEMO_ADM; api = async () => adm; }
    paint();
  } catch { $("#app").innerHTML = `<div class="card" style="text-align:center">${T("err")}</div>`; }
})();
</script>
</body>
</html>
